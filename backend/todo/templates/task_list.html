{% extends "base.html" %}
{% block content %}
<div class="container">
    <h2>Inbox</h2>
    <a href="{% url 'add_task' %}" class="btn btn-primary">+ Add Task</a>
    <ul class="list-group mt-3">
        {% for task in tasks %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
            <span>{{ task.title }} ({{ task.priority }}) - Due: {{ task.due_date }}</span>
            <a href="{% url 'delete_task' task.id %}" class="btn btn-danger btn-sm">Delete</a>
        </li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
